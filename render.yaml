# render.yaml

services:
  - type: web
    name: ebeam-webmonitor
    env: node
    branch: main  # or whatever branch your code lives on
    buildCommand: "npm install"
    startCommand: "npm start"
    plan: free
    envVars:
      - key: NODE_VERSION
        value: "24.22.1"
    # Optionally, add app environment variables to envVars above:
    #   - key: FILE_URL
    #     value: "https://drive.google.com/uc?export=download&id=YOUR_FILE_ID_HERE"
